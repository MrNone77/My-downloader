name: "📥 My Personal Downloader"

on:
  workflow_dispatch:
    inputs:
      urls:
        description: '🔗 لینک های دانلود (با فاصله جدا کنید)'
        required: true
        type: string
      mode:
        description: '📦 حالت ذخیره سازی'
        required: false
        default: 'separate'
        type: choice
        options:
          - separate
          - zip_together
      zip_password:
        description: '🔒 رمز فایل زیپ (اختیاری)'
        required: false
        default: ''
        type: string

jobs:
  downloader:
    name: "📥 دانلود و آپلود فایل"
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔧 Install Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq aria2 zip curl bc python3 python3-pip ffmpeg
          pip3 install yt-dlp
          echo "✅ ابزارها نصب شدن"

      - name: 🍪 Setup Cookies
        if: ${{ secrets.YOUTUBE_COOKIES != '' }}
        run: |
          echo "${{ secrets.YOUTUBE_COOKIES }}" > /tmp/cookies.txt
          echo "✅ کوکی آماده شد"

      - name: ⚙️ Configure Git
        run: |
          git config --global http.postBuffer 524288000
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: 📥 Download & Process Files
        id: download
        run: |
          URLS="${{ github.event.inputs.urls }}"
          MODE="${{ github.event.inputs.mode }}"
          ZIP_PASS="${{ github.event.inputs.zip_password }}"
          
          SPLIT_MB=45
          SPLIT_BYTES=$(( SPLIT_MB * 1024 * 1024 ))
          
          STORAGE="/tmp/storage"
          TMP_DL="/tmp/downloads_temp"
          mkdir -p "$STORAGE" "$TMP_DL"
          
          # آماده‌سازی آرگومان کوکی
          COOKIE_ARG=""
          if [ -f /tmp/cookies.txt ] && [ -s /tmp/cookies.txt ]; then
            COOKIE_ARG="--cookies /tmp/cookies.txt"
            echo "🍪 استفاده از کوکی برای احراز هویت"
          fi
          
          is_youtube() {
            echo "$1" | grep -qiE "(youtube\.com|youtu\.be)"
          }
          
          is_social_media() {
            echo "$1" | grep -qiE "(instagram\.com|twitter\.com|x\.com|tiktok\.com|facebook\.com|reddit\.com|vimeo\.com|dailymotion\.com|twitch\.tv)"
          }
          
          download_normal() {
            local url="$1"
            local name="$2"
            name=$(echo "$name" | sed 's/[?#].*//' | sed 's/[<>:"|?*]/_/g')
            
            echo "⬇️ دانلود معمولی: $name"
            
            aria2c -x4 -s4 \
              --max-tries=3 \
              --retry-wait=5 \
              --timeout=120 \
              --connect-timeout=30 \
              --check-certificate=false \
              --allow-overwrite=true \
              --auto-file-renaming=false \
              -d "$TMP_DL" \
              -o "$name" \
              "$url" 2>/dev/null && return 0
            
            echo "🔄 تلاش با curl..."
            curl -L -f \
              --retry 3 \
              --retry-delay 5 \
              --connect-timeout 30 \
              --max-time 7200 \
              -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" \
              -o "$TMP_DL/$name" \
              "$url" 2>/dev/null && return 0
            
            return 1
          }
          
          download_ytdlp() {
            local url="$1"
            local prefix="$2"
            
            echo "🎬 دانلود با yt-dlp: $url"
            
            cd "$TMP_DL"
            
            yt-dlp \
              $COOKIE_ARG \
              --no-warnings \
              --no-playlist \
              --merge-output-format mp4 \
              --output "${prefix}_%(title)s.%(ext)s" \
              --format "bestvideo[ext=mp4]+bestaudio[ext=m4a]/best[ext=mp4]/best" \
              --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" \
              --retries 5 \
              --fragment-retries 5 \
              --socket-timeout 30 \
              "$url" 2>&1 && return 0
            
            return 1
          }
          
          save_file() {
            local file="$1"
            local size=$(stat -c%s "$file" 2>/dev/null || echo 0)
            local name=$(basename "$file")
            local folder_name="${name%.*}"
            local folder="$STORAGE/$folder_name"
            
            mkdir -p "$folder"
            
            if [ "$size" -gt "$SPLIT_BYTES" ]; then
              echo "📦 قطعه قطعه کردن: $name ($(( size / 1024 / 1024 ))MB)"
              cd "$folder"
              [ -n "$ZIP_PASS" ] && pw_arg="-P $ZIP_PASS" || pw_arg=""
              zip -j $pw_arg -s ${SPLIT_MB}m "$folder_name.zip" "$file" 2>/dev/null
              cd - > /dev/null
            else
              echo "📦 ذخیره: $name ($(( size / 1024 / 1024 ))MB)"
              [ -n "$ZIP_PASS" ] && pw_arg="-P $ZIP_PASS" || pw_arg=""
              zip -j $pw_arg "$folder/$folder_name.zip" "$file" 2>/dev/null
            fi
            
            make_readme "$folder" "$name" "$size"
          }
          
          make_readme() {
            local folder="$1"
            local original_name="$2"
            local original_size="$3"
            local folder_name=$(basename "$folder")
            
            local part_count=0
            local total_size=0
            for p in "$folder"/*.zip "$folder"/*.z"0"* "$folder"/*.z"1"*; do
              [ -f "$p" ] || continue
              part_count=$((part_count + 1))
              total_size=$((total_size + $(stat -c%s "$p" 2>/dev/null || echo 0)))
            done
            local total_mb=$(echo "scale=2; $total_size / 1048576" | bc)
            
            cat > "$folder/README.md" << EOF
          # 📁 $original_name
          
          | مشخصات | مقدار |
          |---------|-------|
          | **فایل اصلی** | \`$original_name\` |
          | **حجم کل** | $total_mb MB |
          | **تعداد قطعات** | $part_count |
          | **رمز عبور** | $([ -n "$ZIP_PASS" ] && echo "✅ دارد" || echo "❌ ندارد") |
          
          ## 📥 نحوه استخراج
          
          1. تمام قطعات را دانلود کنید
          2. فایل \`$folder_name.zip\` را با WinRAR یا 7-Zip باز کنید
          3. Extract کنید (قطعات خودکار ترکیب می‌شوند)
          $([ -n "$ZIP_PASS" ] && echo "4. رمز عبور را وارد کنید")
          
          ---
          📅 تاریخ: $(date '+%Y-%m-%d %H:%M')
          EOF
          }
          
          FAILED=0
          SUCCESS=0
          COUNT=0
          
          for url in $URLS; do
            COUNT=$((COUNT + 1))
            echo ""
            echo "========================================="
            echo "🔗 لینک $COUNT: $url"
            echo "========================================="
            
            if is_youtube "$url" || is_social_media "$url"; then
              echo "🎬 تشخیص: ویدیو/شبکه اجتماعی"
              if download_ytdlp "$url" "$COUNT"; then
                echo "✅ yt-dlp موفق بود"
              else
                echo "❌ yt-dlp ناموفق - میتونی از Invidious استفاده کنی:"
                echo "   https://inv.nadeko.net/watch?v=$(echo "$url" | grep -oP '(?:v=|youtu\.be/)[^&\s]+' | head -1)"
                FAILED=$((FAILED + 1))
                continue
              fi
            else
              echo "📁 تشخیص: دانلود مستقیم"
              name=$(basename "$url" | sed 's/[?#].*//' | sed 's/[<>:"|?*]/_/g')
              [ -z "$name" ] && name="file_${COUNT}"
              if ! download_normal "$url" "$name"; then
                echo "❌ دانلود ناموفق"
                FAILED=$((FAILED + 1))
                continue
              fi
            fi
            
            for file in "$TMP_DL"/*; do
              [ -f "$file" ] || continue
              [ ! -s "$file" ] && continue
              
              name=$(basename "$file")
              echo "✅ ذخیره: $name"
              save_file "$file"
              SUCCESS=$((SUCCESS + 1))
            done
            
            rm -f "$TMP_DL"/* 2>/dev/null
          done
          
          if [ "$MODE" = "zip_together" ] && [ "$SUCCESS" -gt 1 ]; then
            echo ""
            echo "📦 ساخت آرشیو ترکیبی..."
            BUNDLE="bundle_$(date +%Y%m%d_%H%M%S)"
            BUNDLE_DIR="$STORAGE/$BUNDLE"
            mkdir -p "$BUNDLE_DIR"
            
            all_files=""
            for d in "$STORAGE"/*/; do
              [ -d "$d" ] || continue
              [ "$(basename "$d")" = "$BUNDLE" ] && continue
              for f in "$d"/*.zip "$d"/*.z"0"*; do
                [ -f "$f" ] && all_files="$all_files $f"
              done
            done
            
            if [ -n "$all_files" ]; then
              cd "$BUNDLE_DIR"
              [ -n "$ZIP_PASS" ] && pw_arg="-P $ZIP_PASS" || pw_arg=""
              zip -j $pw_arg -s ${SPLIT_MB}m "$BUNDLE.zip" $all_files 2>/dev/null
              cd - > /dev/null
              make_readme "$BUNDLE_DIR" "Combined_Archive.zip" $(du -sb "$STORAGE" | cut -f1)
            fi
          fi
          
          {
            echo "# 📥 فایل‌های دانلود شده"
            echo ""
            echo "| # | پوشه | لینک |"
            echo "|---|-------|------|"
            num=1
            for d in "$STORAGE"/*/; do
              [ -d "$d" ] || continue
              dn=$(basename "$d")
              echo "| $num | \`$dn\` | [مشاهده](./downloads/$dn/) |"
              num=$((num + 1))
            done
            echo ""
            echo "---"
            echo "📅 آخرین به‌روزرسانی: $(date '+%Y-%m-%d %H:%M')"
          } > "$STORAGE/README.md"
          
          echo ""
          echo "========================================="
          echo "✅ دانلود تموم شد: $SUCCESS موفق | $FAILED ناموفق"
          echo "========================================="
          echo "storage=$STORAGE" >> $GITHUB_OUTPUT

      - name: 📤 Push to GitHub
        run: |
          STORAGE="/tmp/storage"
          BRANCH="${GITHUB_REF_NAME}"
          
          if [ ! -d "$STORAGE" ] || [ -z "$(ls -A $STORAGE 2>/dev/null)" ]; then
            echo "❌ فایلی برای آپلود نیست"
            exit 1
          fi
          
          rm -rf downloads
          mkdir -p downloads
          cp -r "$STORAGE"/* downloads/
          
          git add downloads/ README.md 2>/dev/null
          
          git commit -m "📥 آپدیت دانلودها - $(date '+%Y-%m-%d %H:%M')" 2>/dev/null || {
            echo "ℹ️ تغییر جدیدی نیست"
            exit 0
          }
          
          for i in 1 2 3 4 5; do
            echo "🔄 تلاش $i برای push..."
            if git push origin HEAD:"$BRANCH" 2>&1; then
              echo "✅ آپلود موفق!"
              break
            fi
            echo "⏳ صبر ۵ ثانیه..."
            sleep 5
          done

      - name: 🎉 نمایش نتیجه
        run: |
          echo ""
          echo "========================================="
          echo "✅ کار تموم شد!"
          echo ""
          echo "🔗 فایل‌ها اینجان:"
          echo "${{ github.server_url }}/${{ github.repository }}/tree/${{ github.ref_name }}/downloads"
          echo "========================================="
