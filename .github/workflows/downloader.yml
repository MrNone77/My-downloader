name: "🎯 YouTube Downloader Pro"

on:
  workflow_dispatch:
    inputs:
      video_urls:
        description: '🔗 لینک ویدیو (چند لینک با فاصله)'
        required: true
        type: string
      quality:
        description: '🎬 کیفیت'
        required: false
        default: 'best'
        type: choice
        options:
          - best
          - 2160
          - 1440
          - 1080
          - 720
          - 480
          - audio
      download_subtitles:
        description: '📝 زیرنویس فارسی و انگلیسی'
        required: false
        default: false
        type: boolean
      password:
        description: '🔒 رمز فایل (اختیاری)'
        required: false
        default: ''
        type: string

jobs:
  download:
    name: "📥 دانلود از یوتیوب"
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⚙️ Configure Git
        run: |
          git config --global http.postBuffer 524288000
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: 🚀 Start Cloudflare WARP Proxy
        run: |
          echo "🚀 راه‌اندازی WARP..."
          docker run -d \
            --name warp \
            -p 1080:1080 \
            --cap-add NET_ADMIN \
            --sysctl net.ipv6.conf.all.disable_ipv6=0 \
            --sysctl net.ipv4.conf.all.src_valid_mark=1 \
            caomingjun/warp
          
          echo "⏳ صبر برای WARP..."
          sleep 15
          
          for i in {1..5}; do
            RESULT=$(curl -s --max-time 5 --socks5-hostname 127.0.0.1:1080 https://cloudflare.com/cdn-cgi/trace 2>/dev/null || echo "")
            if echo "$RESULT" | grep -qE "warp=(on|plus)"; then
              echo "✅ WARP آماده"
              break
            fi
            echo "🔄 تلاش $i/5..."
            sleep 5
          done

      - name: 🔧 Install Tools (Fast)
        run: |
          sudo apt-get install -y -qq --no-install-recommends python3-pip ffmpeg zip p7zip-full curl 2>/dev/null
          curl -fsSL https://deno.land/install.sh | sh 2>/dev/null
          echo "$HOME/.deno/bin" >> $GITHUB_PATH
          pip3 install -q --no-cache-dir yt-dlp 2>/dev/null
          echo "✅ ابزارها نصب شدن"

      - name: 📥 دانلود ویدیو
        env:
          YT_URLS: ${{ github.event.inputs.video_urls }}
          YT_QUALITY: ${{ github.event.inputs.quality }}
          YT_PASSWORD: ${{ github.event.inputs.password }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          BRANCH: ${{ github.ref_name }}
        run: |
          URLS="${YT_URLS}"
          QUALITY="${YT_QUALITY}"
          ZIP_PASSWORD="${YT_PASSWORD}"
          SPLIT_MB=45
          SPLIT_BYTES=$(( SPLIT_MB * 1024 * 1024 ))
          STORAGE="/tmp/downloads"
          mkdir -p "$STORAGE"
          
          # ⭐️ فرمت‌های اصلاح شده برای کیفیت واقعی
          case "$QUALITY" in
            "audio")
              FORMAT="bestaudio/best"
              EXTRA="--extract-audio --audio-format mp3 --audio-quality 0"
              ;;
            "best")
              FORMAT="bestvideo[ext=mp4]+bestaudio[ext=m4a]/bestvideo+bestaudio/best"
              EXTRA="--merge-output-format mp4"
              ;;
            "2160")
              FORMAT="bestvideo[height<=2160][ext=mp4]+bestaudio[ext=m4a]/bestvideo[height<=2160]+bestaudio/bestvideo+bestaudio/best"
              EXTRA="--merge-output-format mp4"
              ;;
            "1440")
              FORMAT="bestvideo[height<=1440][ext=mp4]+bestaudio[ext=m4a]/bestvideo[height<=1440]+bestaudio/bestvideo+bestaudio/best"
              EXTRA="--merge-output-format mp4"
              ;;
            "1080")
              FORMAT="bestvideo[height<=1080][ext=mp4]+bestaudio[ext=m4a]/bestvideo[height<=1080]+bestaudio/bestvideo+bestaudio/best"
              EXTRA="--merge-output-format mp4"
              ;;
            "720")
              FORMAT="bestvideo[height<=720][ext=mp4]+bestaudio[ext=m4a]/bestvideo[height<=720]+bestaudio/bestvideo+bestaudio/best"
              EXTRA="--merge-output-format mp4"
              ;;
            "480")
              FORMAT="bestvideo[height<=480][ext=mp4]+bestaudio[ext=m4a]/bestvideo[height<=480]+bestaudio/bestvideo+bestaudio/best"
              EXTRA="--merge-output-format mp4"
              ;;
            *)
              FORMAT="bestvideo[ext=mp4]+bestaudio[ext=m4a]/bestvideo+bestaudio/best"
              EXTRA="--merge-output-format mp4"
              ;;
          esac
          
          echo "🎯 کیفیت درخواستی: $QUALITY"
          echo "🎯 فرمت: $FORMAT"
          
          download_video() {
            local method=$1 url=$2 tmpdir=$3
            
            COMMON="--output ${tmpdir}/%(title)s.%(ext)s --no-playlist --retries 3 --fragment-retries 3 --no-check-certificates --socket-timeout 30 --newline --no-warnings"
            
            # اول روش ۳ که جواب داد
            case $method in
              1) echo "🔄 روش 1 (Android + WARP)"
                 yt-dlp --proxy socks5://127.0.0.1:1080 --format "$FORMAT" $EXTRA $COMMON \
                   --extractor-args "youtube:player_client=android" \
                   --user-agent "Mozilla/5.0 (Linux; Android 12) Chrome/112.0.0.0 Mobile Safari/537.36" \
                   "$url" 2>/dev/null && return 0 ;;
              2) echo "🔄 روش 2 (Web + WARP + Deno)"
                 yt-dlp --proxy socks5://127.0.0.1:1080 --format "$FORMAT" $EXTRA $COMMON \
                   --extractor-args "youtube:player_client=web" --js-runtimes deno "$url" 2>/dev/null && return 0 ;;
              3) echo "🔄 روش 3 (MWEB + WARP)"
                 yt-dlp --proxy socks5://127.0.0.1:1080 --format "$FORMAT" $EXTRA $COMMON \
                   --extractor-args "youtube:player_client=mweb" "$url" 2>/dev/null && return 0 ;;
              4) echo "🔄 روش 4 (Android + بدون WARP)"
                 yt-dlp --format "$FORMAT" $EXTRA $COMMON \
                   --extractor-args "youtube:player_client=android" \
                   --user-agent "Mozilla/5.0 (Linux; Android 12) Chrome/112.0.0.0 Mobile Safari/537.36" \
                   "$url" 2>/dev/null && return 0 ;;
              5) echo "🔄 روش 5 (Web + بدون WARP + Deno)"
                 yt-dlp --format "$FORMAT" $EXTRA $COMMON \
                   --extractor-args "youtube:player_client=web" --js-runtimes deno "$url" 2>/dev/null && return 0 ;;
            esac
            return 1
          }
          
          save_file() {
            local file="$1"
            local size=$(stat -c%s "$file" 2>/dev/null || echo 0)
            [ "$size" -lt 10000 ] && return 1
            
            local name=$(basename "$file")
            local folder="${name%.*}"
            local dest="$STORAGE/$folder"
            mkdir -p "$dest"
            
            # ⭐️ بررسی کیفیت واقعی
            ACTUAL_HEIGHT=""
            if [ "$QUALITY" != "audio" ]; then
              ACTUAL_HEIGHT=$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$file" 2>/dev/null || echo "نامشخص")
              echo "📊 کیفیت واقعی: ${ACTUAL_HEIGHT}p"
            fi
            
            if [ "$size" -gt "$SPLIT_BYTES" ]; then
              echo "📦 قطعه‌قطعه: $name ($(( size / 1048576 ))MB)"
              cd "$dest"
              [ -n "$ZIP_PASSWORD" ] && pw="-p${ZIP_PASSWORD}" || pw=""
              7z a -tzip -v${SPLIT_MB}m $pw -mx=0 "$folder.zip" "$file" 2>/dev/null
              cd - > /dev/null
            else
              echo "📦 ذخیره: $name ($(( size / 1048576 ))MB)"
              if [ -n "$ZIP_PASSWORD" ]; then
                7z a -tzip -p"${ZIP_PASSWORD}" -mx=0 "$dest/$folder.zip" "$file" 2>/dev/null
              else
                cp "$file" "$dest/$folder.mp4" 2>/dev/null
              fi
            fi
            
            cat > "$dest/README.md" << EOF
          # 🎬 $name
          
          | مشخصات | مقدار |
          |---------|-------|
          | **کیفیت** | ${ACTUAL_HEIGHT}p |
          | **حجم** | $(( size / 1048576 )) MB |
          | **رمز** | $([ -n "$ZIP_PASSWORD" ] && echo "✅ دارد" || echo "❌ ندارد") |
          
          ## 📥 نحوه استخراج
          1. همه قطعات رو دانلود کن
          2. \`$folder.zip\` رو با WinRAR / 7-Zip باز کن
          $([ -n "$ZIP_PASSWORD" ] && echo "3. رمز رو وارد کن")
          EOF
          }
          
          SUCCESS=0; FAILED=0
          
          for url in $URLS; do
            echo ""
            echo "🔗 $url"
            
            TMPDIR="/tmp/dl_$$"
            mkdir -p "$TMPDIR"
            OK=false
            
            for m in 1 2 3 4 5; do
              if download_video $m "$url" "$TMPDIR"; then
                echo "✅ موفق!"
                OK=true
                break
              fi
              sleep 2
            done
            
            if [ "$OK" = true ]; then
              for f in "$TMPDIR"/*; do
                [ -f "$f" ] || continue
                save_file "$f" && SUCCESS=$((SUCCESS + 1))
              done
            else
              FAILED=$((FAILED + 1))
              echo "❌ ناموفق"
            fi
            
            rm -rf "$TMPDIR"
          done
          
          echo "✅ $SUCCESS موفق | ❌ $FAILED ناموفق"
          echo "$STORAGE" > /tmp/storage.txt

      - name: 🧹 Stop WARP
        if: always()
        run: docker rm -f warp 2>/dev/null || true

      - name: 📤 Push
        run: |
          STORAGE=$(cat /tmp/storage.txt)
          [ ! -d "$STORAGE" ] && exit 0
          
          rm -rf videos
          mkdir -p videos
          cp -r "$STORAGE"/* videos/
          
          {
            echo "# 🎬 دانلودها"
            num=1
            for d in videos/*/; do
              [ -d "$d" ] && echo "$num. 📁 \`$(basename "$d")\`" && num=$((num + 1))
            done
          } > videos/README.md
          
          git add videos/ 2>/dev/null
          git diff --cached --quiet 2>/dev/null && exit 0
          git commit -m "🎬 $(date '+%m/%d %H:%M')"
          git pull --rebase origin main 2>/dev/null || true
          git push origin main 2>/dev/null || (git pull --rebase origin main && git push origin main)

      - name: 🎉 Done
        run: |
          echo "✅ تموم شد!"
          echo "🔗 ${{ github.server_url }}/${{ github.repository }}/tree/main/videos"
