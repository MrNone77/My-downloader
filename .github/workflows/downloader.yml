name: "📥 My Personal Downloader"

on:
  workflow_dispatch:
    inputs:
      urls:
        description: '🔗 لینک های دانلود (با فاصله جدا کنید)'
        required: true
        type: string
      mode:
        description: '📦 حالت ذخیره سازی'
        required: false
        default: 'separate'
        type: choice
        options:
          - separate
          - zip_together
      zip_password:
        description: '🔒 رمز فایل زیپ (اختیاری)'
        required: false
        default: ''
        type: string

jobs:
  downloader:
    name: "📥 دانلود و آپلود فایل"
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔧 Install Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq aria2 zip curl bc python3 python3-pip ffmpeg
          pip3 install yt-dlp
          echo "✅ ابزارها نصب شدن"

      - name: 🍪 Setup Cookies
        run: |
          if [ -n "$COOKIES" ]; then
            echo "$COOKIES" > /tmp/cookies.txt
            echo "✅ کوکی آماده شد"
          else
            echo "ℹ️ کوکی تنظیم نشده"
          fi
        env:
          COOKIES: ${{ secrets.YOUTUBE_COOKIES }}

      - name: ⚙️ Configure Git
        run: |
          git config --global http.postBuffer 524288000
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: 📥 Download & Process Files
        id: download
        run: |
          URLS="${{ github.event.inputs.urls }}"
          MODE="${{ github.event.inputs.mode }}"
          ZIP_PASS="${{ github.event.inputs.zip_password }}"
          
          SPLIT_MB=45
          SPLIT_BYTES=$(( SPLIT_MB * 1024 * 1024 ))
          
          STORAGE="/tmp/storage"
          TMP_DL="/tmp/downloads_temp"
          mkdir -p "$STORAGE" "$TMP_DL"
          
          COOKIE_ARG=""
          [ -f /tmp/cookies.txt ] && [ -s /tmp/cookies.txt ] && COOKIE_ARG="--cookies /tmp/cookies.txt"
          
          INVIDIOUS_SERVERS=(
            "https://yewtu.be"
            "https://vid.puffyan.us"
            "https://inv.zzls.xyz"
            "https://invidious.slipfox.xyz"
            "https://iv.melmac.space"
            "https://inv.nadeko.net"
          )
          
          is_video() {
            echo "$1" | grep -qiE "(youtube\.com|youtu\.be|invidious|inv\.|yewtu\.be|piped\.|vid\.puffyan|instagram\.com|twitter\.com|x\.com|tiktok\.com|vimeo\.com|dailymotion\.com|twitch\.tv)"
          }
          
          extract_youtube_id() {
            local url="$1"
            local id=""
            if echo "$url" | grep -qE "youtu\.be/"; then
              id=$(echo "$url" | sed 's|.*youtu\.be/||' | sed 's|[?#].*||')
            elif echo "$url" | grep -qE "watch\?v="; then
              id=$(echo "$url" | sed 's|.*watch?v=||' | sed 's|[&#].*||')
            elif echo "$url" | grep -qE "/watch/"; then
              id=$(echo "$url" | sed 's|.*/watch/||' | sed 's|[?#/].*||')
            fi
            [ ${#id} -eq 11 ] && echo "$id" || echo ""
          }
          
          try_invidious_servers() {
            local video_id="$1"
            local prefix="$2"
            for server in "${INVIDIOUS_SERVERS[@]}"; do
              echo "🔄 تلاش با سرور: $server"
              cd "$TMP_DL"
              if yt-dlp \
                --no-warnings \
                --no-playlist \
                --merge-output-format mp4 \
                --output "${prefix}_%(title)s.%(ext)s" \
                --format "best[height<=1080]/best" \
                --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
                --retries 3 \
                --socket-timeout 30 \
                --force-ipv4 \
                "${server}/watch?v=${video_id}" 2>&1; then
                echo "✅ موفق با سرور: $server"
                return 0
              fi
              cd - > /dev/null
            done
            return 1
          }
          
          download_ytdlp() {
            local url="$1"
            local prefix="$2"
            echo "🎬 دانلود با yt-dlp: $url"
            cd "$TMP_DL"
            yt-dlp \
              $COOKIE_ARG \
              --no-warnings \
              --no-playlist \
              --merge-output-format mp4 \
              --output "${prefix}_%(title)s.%(ext)s" \
              --format "best[height<=1080]/best" \
              --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
              --retries 5 \
              --fragment-retries 5 \
              --socket-timeout 60 \
              --extractor-retries 3 \
              --force-ipv4 \
              --no-check-certificates \
              "$url" 2>&1 && return 0
            return 1
          }
          
          download_direct() {
            local url="$1"
            local name="$2"
            name=$(echo "$name" | sed 's/[?#].*//' | sed 's/[<>:"|?*]/_/g')
            echo "⬇️ دانلود مستقیم: $name"
            curl -L -f \
              --retry 5 \
              --retry-delay 5 \
              --connect-timeout 30 \
              --max-time 7200 \
              -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
              -H "Accept: */*" \
              -o "$TMP_DL/$name" \
              "$url" 2>/dev/null && return 0
            return 1
          }
          
          save_file() {
            local file="$1"
            local size=$(stat -c%s "$file" 2>/dev/null || echo 0)
            if [ "$size" -lt 10000 ]; then
              echo "⚠️ فایل مشکوکه (فقط ${size} بایت)"
              return 1
            fi
            local name=$(basename "$file")
            local folder_name="${name%.*}"
            local folder="$STORAGE/$folder_name"
            mkdir -p "$folder"
            if [ "$size" -gt "$SPLIT_BYTES" ]; then
              echo "📦 قطعه قطعه کردن: $name ($(( size / 1024 / 1024 ))MB)"
              cd "$folder"
              [ -n "$ZIP_PASS" ] && pw_arg="-P $ZIP_PASS" || pw_arg=""
              zip -j $pw_arg -s ${SPLIT_MB}m "$folder_name.zip" "$file" 2>/dev/null
              cd - > /dev/null
            else
              echo "📦 ذخیره: $name ($(( size / 1024 / 1024 ))MB)"
              [ -n "$ZIP_PASS" ] && pw_arg="-P $ZIP_PASS" || pw_arg=""
              zip -j $pw_arg "$folder/$folder_name.zip" "$file" 2>/dev/null
            fi
            make_readme "$folder" "$name" "$size"
            return 0
          }
          
          make_readme() {
            local folder="$1"
            local original_name="$2"
            local folder_name=$(basename "$folder")
            local part_count=0
            local total_size=0
            for p in "$folder"/*.zip "$folder"/*.z"0"* "$folder"/*.z"1"*; do
              [ -f "$p" ] || continue
              part_count=$((part_count + 1))
              total_size=$((total_size + $(stat -c%s "$p" 2>/dev/null || echo 0)))
            done
            local total_mb=$(echo "scale=2; $total_size / 1048576" | bc)
            cat > "$folder/README.md" << README_EOF
          # 📁 $original_name
          
          | مشخصات | مقدار |
          |---------|-------|
          | **فایل اصلی** | \`$original_name\` |
          | **حجم کل** | $total_mb MB |
          | **تعداد قطعات** | $part_count |
          | **رمز عبور** | $([ -n "$ZIP_PASS" ] && echo "✅ دارد" || echo "❌ ندارد") |
          
          ## 📥 نحوه استخراج
          
          1. تمام قطعات را دانلود کنید
          2. فایل \`$folder_name.zip\` را با WinRAR یا 7-Zip باز کنید
          3. Extract کنید
          $([ -n "$ZIP_PASS" ] && echo "4. رمز عبور را وارد کنید")
          README_EOF
          }
          
          SUCCESS=0
          FAILED=0
          COUNT=0
          
          for url in $URLS; do
            COUNT=$((COUNT + 1))
            echo ""
            echo "========================================="
            echo "🔗 لینک $COUNT: $url"
            echo "========================================="
            
            VIDEO_ID=$(extract_youtube_id "$url")
            DOWNLOADED=false
            
            if [ -n "$VIDEO_ID" ]; then
              echo "🎯 ویدیو YouTube شناسایی شد: $VIDEO_ID"
              echo "🔄 تلاش مستقیم با yt-dlp..."
              if download_ytdlp "$url" "$COUNT"; then
                DOWNLOADED=true
              else
                echo "❌ دانلود مستقیم ناموفق"
                echo "🔄 تلاش با سرورهای Invidious..."
                if try_invidious_servers "$VIDEO_ID" "$COUNT"; then
                  DOWNLOADED=true
                else
                  echo "❌ تمام سرورهای Invidious ناموفق بودن"
                fi
              fi
            elif is_video "$url"; then
              if download_ytdlp "$url" "$COUNT"; then
                DOWNLOADED=true
              fi
            else
              echo "📁 دانلود مستقیم..."
              name="file_${COUNT}"
              if download_direct "$url" "$name"; then
                DOWNLOADED=true
              fi
            fi
            
            if [ "$DOWNLOADED" = true ]; then
              for file in "$TMP_DL"/*; do
                [ -f "$file" ] || continue
                [ ! -s "$file" ] && continue
                name=$(basename "$file")
                if save_file "$file"; then
                  echo "✅ ذخیره شد: $name"
                  SUCCESS=$((SUCCESS + 1))
                fi
              done
            else
              FAILED=$((FAILED + 1))
            fi
            rm -f "$TMP_DL"/* 2>/dev/null
          done
          
          {
            echo "# 📥 فایل‌های دانلود شده"
            echo ""
            echo "| # | پوشه |"
            echo "|---|-------|"
            num=1
            for d in "$STORAGE"/*/; do
              [ -d "$d" ] || continue
              dn=$(basename "$d")
              echo "| $num | \`$dn\` |"
              num=$((num + 1))
            done
          } > "$STORAGE/README.md"
          
          echo ""
          echo "========================================="
          echo "✅ $SUCCESS موفق | ❌ $FAILED ناموفق"
          echo "========================================="
          echo "storage=$STORAGE" >> $GITHUB_OUTPUT

      - name: 📤 Push to GitHub
        run: |
          STORAGE="/tmp/storage"
          if [ ! -d "$STORAGE" ] || [ -z "$(ls -A $STORAGE 2>/dev/null)" ]; then
            echo "ℹ️ فایلی برای آپلود نیست"
            exit 1
          fi
          rm -rf downloads
          mkdir -p downloads
          cp -r "$STORAGE"/* downloads/
          git add downloads/ 2>/dev/null
          git add README.md 2>/dev/null
          if git diff --cached --quiet 2>/dev/null; then
            echo "ℹ️ تغییر جدیدی نیست"
            exit 0
          fi
          git commit -m "📥 دانلود جدید - $(date '+%m/%d %H:%M')" 2>/dev/null
          git pull --rebase origin main 2>/dev/null || true
          git push origin main 2>&1 || {
            git pull --rebase origin main
            git push origin main
          }
          echo "✅ آپلود موفق!"

      - name: 🎉 نتیجه
        run: |
          echo "========================================="
          echo "✅ انجام شد!"
          echo "🔗 ${{ github.server_url }}/${{ github.repository }}/tree/main/downloads"
          echo "========================================="
