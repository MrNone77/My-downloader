name: "🎯 YouTube Downloader Pro"

on:
  workflow_dispatch:
    inputs:
      video_urls:
        description: '🔗 لینک ویدیو (چند لینک با فاصله)'
        required: true
        type: string
      quality:
        description: '🎬 کیفیت'
        required: false
        default: 'best'
        type: choice
        options:
          - best
          - 2160
          - 1440
          - 1080
          - 720
          - 480
          - audio
      download_subtitles:
        description: '📝 زیرنویس فارسی و انگلیسی'
        required: false
        default: false
        type: boolean
      password:
        description: '🔒 رمز فایل (اختیاری)'
        required: false
        default: ''
        type: string

jobs:
  download:
    name: "📥 دانلود از یوتیوب"
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⚙️ Configure Git
        run: |
          git config --global http.postBuffer 524288000
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: 🚀 Start Cloudflare WARP Proxy
        run: |
          echo "🚀 راه‌اندازی WARP..."
          docker run -d \
            --name warp \
            -p 1080:1080 \
            --cap-add NET_ADMIN \
            --sysctl net.ipv6.conf.all.disable_ipv6=0 \
            --sysctl net.ipv4.conf.all.src_valid_mark=1 \
            caomingjun/warp
          
          echo "⏳ صبر برای آماده‌سازی WARP..."
          sleep 15
          
          for i in {1..5}; do
            RESULT=$(curl -s --max-time 5 --socks5-hostname 127.0.0.1:1080 https://cloudflare.com/cdn-cgi/trace 2>/dev/null || echo "")
            if echo "$RESULT" | grep -qE "warp=(on|plus)"; then
              echo "✅ WARP فعال شد"
              break
            fi
            echo "🔄 تلاش $i/5..."
            sleep 5
          done

      - name: 🔧 Install Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pip ffmpeg zip p7zip-full curl bc
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> $GITHUB_PATH
          pip3 install --upgrade yt-dlp
          echo "✅ ابزارها نصب شدن"

      - name: 📥 دانلود ویدیو
        env:
          YT_URLS: ${{ github.event.inputs.video_urls }}
          YT_QUALITY: ${{ github.event.inputs.quality }}
          YT_PASSWORD: ${{ github.event.inputs.password }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          BRANCH: ${{ github.ref_name }}
        run: |
          URLS="${YT_URLS}"
          QUALITY="${YT_QUALITY}"
          ZIP_PASSWORD="${YT_PASSWORD}"
          SPLIT_MB=45
          SPLIT_BYTES=$(( SPLIT_MB * 1024 * 1024 ))
          STORAGE="/tmp/downloads"
          mkdir -p "$STORAGE"
          
          # ── تنظیم فرمت ──
          case "$QUALITY" in
            "audio") FORMAT="bestaudio/best";;
            "best")  FORMAT="bestvideo+bestaudio/best";;
            "2160")  FORMAT="bestvideo[height<=2160]+bestaudio/best";;
            "1440")  FORMAT="bestvideo[height<=1440]+bestaudio/best";;
            "1080")  FORMAT="bestvideo[height<=1080]+bestaudio/best";;
            "720")   FORMAT="bestvideo[height<=720]+bestaudio/best";;
            "480")   FORMAT="bestvideo[height<=480]+bestaudio/best";;
            *)       FORMAT="bestvideo+bestaudio/best";;
          esac
          
          # ── توابع ──
          urlencode() {
            python3 -c "import urllib.parse; print(urllib.parse.quote('$1', safe=''))"
          }
          
          download_video() {
            local method=$1 url=$2 tmpdir=$3
            echo "🔄 روش $method..."
            
            # تنظیمات مشترک
            if [ "$QUALITY" = "audio" ]; then
              COMMON="--extract-audio --audio-format mp3 --audio-quality 0 --output ${tmpdir}/%(title)s.%(ext)s"
            else
              COMMON="--merge-output-format mp4 --output ${tmpdir}/%(title)s.%(ext)s"
            fi
            
            COMMON="$COMMON --no-playlist --retries 5 --fragment-retries 5 --no-check-certificates --socket-timeout 30 --newline"
            
            case $method in
              1) yt-dlp --proxy socks5://127.0.0.1:1080 --format "$FORMAT" $COMMON \
                   --extractor-args "youtube:player_client=web" --js-runtimes deno \
                   --remote-components ejs:github \
                   --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/124.0.0.0 Safari/537.36" \
                   "$url" && return 0 ;;
              2) yt-dlp --proxy socks5://127.0.0.1:1080 --format "$FORMAT" $COMMON \
                   --extractor-args "youtube:player_client=mweb" "$url" && return 0 ;;
              3) yt-dlp --proxy socks5://127.0.0.1:1080 --format "$FORMAT" $COMMON \
                   --extractor-args "youtube:player_client=android_vr" "$url" && return 0 ;;
              4) yt-dlp --proxy socks5://127.0.0.1:1080 --format "$FORMAT" $COMMON \
                   --extractor-args "youtube:player_client=android" \
                   --user-agent "Mozilla/5.0 (Linux; Android 12) Chrome/112.0.0.0 Mobile Safari/537.36" \
                   "$url" && return 0 ;;
              5) yt-dlp --format "$FORMAT" $COMMON \
                   --extractor-args "youtube:player_client=web" --js-runtimes deno \
                   --remote-components ejs:github "$url" && return 0 ;;
              6) yt-dlp --format "$FORMAT" $COMMON \
                   --extractor-args "youtube:player_client=mweb" "$url" && return 0 ;;
            esac
            return 1
          }
          
          save_file() {
            local file="$1"
            local size=$(stat -c%s "$file" 2>/dev/null || echo 0)
            [ "$size" -lt 10000 ] && return 1
            
            local name=$(basename "$file")
            local folder="${name%.*}"
            local dest="$STORAGE/$folder"
            mkdir -p "$dest"
            
            if [ "$size" -gt "$SPLIT_BYTES" ]; then
              echo "📦 قطعه‌قطعه: $name ($(( size / 1024 / 1024 ))MB)"
              cd "$dest"
              if [ -n "$ZIP_PASSWORD" ]; then
                7z a -tzip -v${SPLIT_MB}m -p"${ZIP_PASSWORD}" -mx=0 "$folder.zip" "$file" 2>/dev/null
              else
                zip -0 -s ${SPLIT_MB}m "$folder.zip" "$file" 2>/dev/null
              fi
              cd - > /dev/null
            else
              echo "📦 ذخیره: $name ($(( size / 1024 / 1024 ))MB)"
              if [ -n "$ZIP_PASSWORD" ]; then
                zip -P "${ZIP_PASSWORD}" "$dest/$folder.zip" "$file" 2>/dev/null
              else
                cp "$file" "$dest/$folder.mp4" 2>/dev/null
              fi
            fi
            
            # README
            local parts=$(ls "$dest"/*.zip "$dest"/*.z* 2>/dev/null | wc -l)
            [ "$parts" -eq 0 ] && parts=1
            
            cat > "$dest/README.md" << EOF
          # 🎬 $name
          
          | مشخصات | مقدار |
          |---------|-------|
          | **کیفیت** | $QUALITY |
          | **حجم** | $(( size / 1024 / 1024 )) MB |
          | **قطعات** | $parts |
          | **رمز** | $([ -n "$ZIP_PASSWORD" ] && echo "✅ دارد" || echo "❌ ندارد") |
          
          ## 📥 نحوه استخراج
          1. همه قطعات رو دانلود کن
          2. \`$folder.zip\` رو با WinRAR / 7-Zip باز کن
          $([ -n "$ZIP_PASSWORD" ] && echo "3. رمز رو وارد کن")
          EOF
          }
          
          # ── دانلود ──
          SUCCESS=0; FAILED=0
          
          for url in $URLS; do
            echo ""
            echo "========================================="
            echo "🔗 $url"
            echo "========================================="
            
            TMPDIR="/tmp/dl_$$"
            mkdir -p "$TMPDIR"
            OK=false
            
            for m in 1 2 3 4 5 6; do
              if download_video $m "$url" "$TMPDIR"; then
                echo "✅ روش $m موفق بود"
                OK=true
                break
              fi
              sleep 2
            done
            
            if [ "$OK" = true ]; then
              for f in "$TMPDIR"/*; do
                [ -f "$f" ] || continue
                if save_file "$f"; then
                  SUCCESS=$((SUCCESS + 1))
                fi
              done
            else
              FAILED=$((FAILED + 1))
              echo "❌ همه روش‌ها ناموفق"
            fi
            
            rm -rf "$TMPDIR"
          done
          
          echo ""
          echo "✅ $SUCCESS موفق | ❌ $FAILED ناموفق"
          echo "$STORAGE" > /tmp/storage_path.txt

      - name: 📝 دانلود زیرنویس
        if: github.event.inputs.download_subtitles == 'true'
        run: |
          STORAGE=$(cat /tmp/storage_path.txt)
          URLS="${{ github.event.inputs.video_urls }}"
          
          for url in $URLS; do
            # پیدا کردن پوشه مرتبط
            for folder in "$STORAGE"/*/; do
              [ -d "$folder" ] || continue
              SUBDIR="$folder/subtitles"
              mkdir -p "$SUBDIR"
              
              echo "📝 زیرنویس برای: $(basename "$folder")"
              
              yt-dlp --proxy socks5://127.0.0.1:1080 \
                --skip-download --write-subs --write-auto-subs \
                --sub-langs "fa,en" --convert-subs srt \
                --output "$SUBDIR/%(title)s" \
                "$url" 2>/dev/null || true
              
              if ls "$SUBDIR"/*.srt 2>/dev/null | grep -q .; then
                cd "$SUBDIR"
                zip -q "$folder/subtitle.zip" *.srt 2>/dev/null
                cd - > /dev/null
                rm -rf "$SUBDIR"
                echo "✅ زیرنویس آماده شد"
              else
                rm -rf "$SUBDIR"
                echo "⚠️ زیرنویسی پیدا نشد"
              fi
              break
            done
          done

      - name: 🧹 Stop WARP
        if: always()
        run: |
          docker stop warp 2>/dev/null || true
          docker rm warp 2>/dev/null || true

      - name: 📤 Push to GitHub
        run: |
          STORAGE=$(cat /tmp/storage_path.txt)
          
          if [ ! -d "$STORAGE" ] || [ -z "$(ls -A $STORAGE 2>/dev/null)" ]; then
            echo "❌ فایلی برای آپلود نیست"
            exit 1
          fi
          
          # انتقال به پوشه videos
          rm -rf videos
          mkdir -p videos
          cp -r "$STORAGE"/* videos/
          
          # فهرست کلی
          {
            echo "# 🎬 ویدیوهای دانلود شده"
            echo ""
            num=1
            for d in videos/*/; do
              [ -d "$d" ] || continue
              dn=$(basename "$d")
              echo "$num. 📁 \`$dn\`"
              num=$((num + 1))
            done
          } > videos/README.md
          
          git add videos/ README.md 2>/dev/null
          
          git diff --cached --quiet 2>/dev/null && {
            echo "ℹ️ تغییر جدیدی نیست"
            exit 0
          }
          
          git commit -m "🎬 دانلود جدید - $(date '+%m/%d %H:%M')"
          
          for i in 1 2 3 4 5; do
            echo "🔄 push $i..."
            if git pull --rebase origin main 2>/dev/null && git push origin main 2>&1; then
              echo "✅ آپلود موفق"
              break
            fi
            sleep 5
          done

      - name: 🎉 Done
        run: |
          echo "========================================="
          echo "✅ تموم شد!"
          echo "🔗 ${{ github.server_url }}/${{ github.repository }}/tree/main/videos"
          echo "========================================="
